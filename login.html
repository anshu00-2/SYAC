<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup Popup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-main {
      padding: 12px 20px;
      background: #2575fc;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    .btn-main:hover {
      background: #1a5bd7;
    }

    /* Popup overlay */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 10; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Popup box */
    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0px 6px 16px rgba(0,0,0,0.3);
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2575fc;
      box-shadow: 0px 0px 5px rgba(37, 117, 252, 0.5);
    }

    .form-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #2575fc;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .form-btn:hover {
      background: #1a5bd7;
    }

    .extra-links {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    .extra-links a {
      color: #2575fc;
      text-decoration: none;
      cursor: pointer;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main page buttons -->
  <button class="btn-main" onclick="openModal('loginModal')">Login</button>
  <button class="btn-main" onclick="openModal('signupModal')">Sign Up</button>

  <!-- Login popup -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form action="login.php" method="POST">
        <div class="form-group">
          <label for="login-username">Email or Username</label>
          <input type="text" id="login-username" name="username" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required>
        </div>
       <a href=""><button type="submit" class="form-btn">Login</button></a>
        <div class="extra-links">
          <p>Don't have an account? <a onclick="switchModal('loginModal','signupModal')">Sign Up</a></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Signup popup -->
  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <form action="signup.php" method="POST">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="fullname" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" required>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" name="confirm_password" required>
        </div>
        <button type="submit" class="form-btn">Sign Up</button>
        <div class="extra-links">
          <p>Already have an account? <a onclick="switchModal('signupModal','loginModal')">Login</a></p>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function switchModal(current, target) {
      closeModal(current);
      openModal(target);
    }

    // Close popup if clicked outside
    window.onclick = function(event) {
      const login = document.getElementById("loginModal");
      const signup = document.getElementById("signupModal");
      if (event.target === login) closeModal("loginModal");
      if (event.target === signup) closeModal("signupModal");
    }
  </script>
</body>
</html>
